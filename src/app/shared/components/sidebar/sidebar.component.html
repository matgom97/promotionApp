<aside
  class="app-sidebar"
  [class.app-sidebar--collapsed]="collapsed()"
>
  <div class="app-sidebar__brand">
    <a
      routerLink="/app/dashboard"
      class="app-sidebar__brand-link"
      aria-label="PromoApp, ir al dashboard"
      (click)="onNavigate()"
    >
      <span class="app-sidebar__brand-icon">P</span>

      <span
        *ngIf="!collapsed()"
        class="app-sidebar__brand-name"
      >
        PromoApp
      </span>
    </a>
  </div>

  <div
    *ngIf="workspace() as currentWorkspace"
    class="app-sidebar__workspace"
  >
    <span class="app-sidebar__workspace-label">
      NEGOCIO ACTIVO
    </span>

    <span class="app-sidebar__workspace-name">
      {{ currentWorkspace.restaurant.name }}
    </span>

    <span class="app-sidebar__workspace-location">
      {{ currentWorkspace.restaurant.city }}
    </span>
  </div>

  <nav
    class="app-sidebar__navigation"
    aria-label="Navegación principal"
  >
    <span class="app-sidebar__section-label">
      PRINCIPAL
    </span>

    <a
      *ngFor="let item of visibleItems()"
      [routerLink]="item.route"
      routerLinkActive="app-sidebar__link--active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="app-sidebar__link"
      [attr.aria-label]="item.label"
      [title]="collapsed() ? item.label : null"
      (click)="onNavigate()"
    >
      <span
        class="app-sidebar__link-icon"
        aria-hidden="true"
      >
        <ng-container [ngSwitch]="item.icon">
          <svg
            *ngSwitchCase="'grid'"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/>
          </svg>

          <svg
            *ngSwitchCase="'tag'"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M20 13 13 20 3 10V3h7l10 10Z"/>
            <circle cx="7.5" cy="7.5" r="1"/>
          </svg>

          <svg
            *ngSwitchCase="'ticket'"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M4 6h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4V6Z"/>
            <path d="M13 7v2m0 3v2m0 3v1"/>
          </svg>

          <svg
            *ngSwitchCase="'users'"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <circle cx="9" cy="8" r="3"/>
            <path d="M3 20v-2a6 6 0 0 1 12 0v2"/>
            <path d="M16 5.5a3 3 0 0 1 0 5.8M18 14a5 5 0 0 1 3 4.5V20"/>
          </svg>

          <svg
            *ngSwitchCase="'chart'"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M3 3v18h18"/>
            <path d="m7 14 4-4 4 3 5-7"/>
          </svg>

          <svg
            *ngSwitchCase="'team'"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <circle cx="9" cy="7" r="3"/>
            <circle cx="17" cy="9" r="2"/>
            <path d="M3 20v-2a6 6 0 0 1 12 0v2"/>
            <path d="M16 15a4 4 0 0 1 5 4v1"/>
          </svg>

          <svg
            *ngSwitchCase="'settings'"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <circle cx="12" cy="12" r="3"/>
            <path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.6-1.4-2.4L7.3 15a8 8 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.6 1.4 2.4-1.4 1.1a8 8 0 0 1-.1 2Z" transform="translate(-1 -1)"/>
          </svg>
        </ng-container>
      </span>

      <span
        *ngIf="!collapsed()"
        class="app-sidebar__link-label"
      >
        {{ item.label }}
      </span>
    </a>

    <p
      *ngIf="visibleItems().length === 0"
      class="app-sidebar__empty"
    >
      No hay opciones disponibles para tu rol.
    </p>
  </nav>

  <div class="app-sidebar__footer">
    <span class="app-sidebar__footer-indicator"></span>

    <span *ngIf="!collapsed()">
      Espacio de trabajo activo
    </span>
  </div>
</aside>
