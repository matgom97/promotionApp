<div
  class="revoke-backdrop"
  (click)="close()"
>
  <section
    class="revoke-dialog"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="revoke-title"
    aria-describedby="revoke-description"
    (click)="$event.stopPropagation()"
  >
    <header class="revoke-dialog__header">
      <div class="revoke-dialog__icon" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="25"
          height="25"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 6h18" />
          <path d="M8 6V4h8v2" />
          <path d="m19 6-1 14H6L5 6" />
          <path d="M10 11v5" />
          <path d="M14 11v5" />
        </svg>
      </div>

      <button
        type="button"
        class="revoke-dialog__close"
        aria-label="Cerrar modal"
        [disabled]="revoking"
        (click)="close()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="19"
          height="19"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="m18 6-12 12" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </header>

    <div class="revoke-dialog__body">
      <span class="revoke-dialog__eyebrow">
        ACCIÓN DE SEGURIDAD
      </span>

      <h2 id="revoke-title">
        Revocar acceso
      </h2>

      <p>
        ¿Quieres quitar a
        <strong>{{ memberName }}</strong>
        de esta organización?
      </p>

      <div
        id="revoke-description"
        class="revoke-dialog__notice"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="19"
          height="19"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="M12 8v4" />
          <path d="M12 16h.01" />
        </svg>

        <p>
          Esta acción eliminará su membresía y las asignaciones a las sedes
          de esta organización. Su cuenta global no será eliminada.
        </p>
      </div>
    </div>

    <footer class="revoke-dialog__footer">
      <button
        type="button"
        class="revoke-button revoke-button--secondary"
        [disabled]="revoking"
        (click)="close()"
      >
        Cancelar
      </button>

      <button
        type="button"
        class="revoke-button revoke-button--danger"
        [disabled]="revoking || confirmationRequested()"
        (click)="confirm()"
      >
        <span
          *ngIf="revoking"
          class="revoke-spinner"
          aria-hidden="true"
        ></span>

        <svg
          *ngIf="!revoking"
          xmlns="http://www.w3.org/2000/svg"
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 6h18" />
          <path d="M8 6V4h8v2" />
          <path d="m19 6-1 14H6L5 6" />
        </svg>

        {{
          revoking
            ? 'Revocando acceso...'
            : confirmationRequested()
              ? 'Procesando...'
              : 'Confirmar revocación'
        }}
      </button>
    </footer>
  </section>
</div>
