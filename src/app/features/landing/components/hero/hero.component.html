<section class="hero">

  <!-- VIDEO DE FONDO -->
  <video
    class="hero__video"
    autoplay
    muted
    
    playsinline
    preload="metadata"
    aria-hidden="true"
  >
    <source
      src="assets/videos/herovideo.mp4"
      type="video/mp4"
    />
  </video>

  <!-- CAPA SOBRE EL VIDEO -->
  <div class="hero__overlay"></div>

  <!-- CONTENIDO -->
  <div class="container hero__container">

    <div class="hero__content">

      <div class="hero__badge">
        <app-icon
          class="hero__badge-icon"
          name="auto_awesome"
          [size]="23"
          [weight]="600"
        />
        <span>Nuevo · Canje verificado con código</span>
      </div>

      <h1 class="hero__title">
        Llena tus mesas en las
        <span>horas valle</span>
      </h1>

      <p class="hero__description">
        Convierte tus promociones en QR, códigos verificables
        y datos accionables. Crea, publica y mide todo desde
        un único panel pensado para restaurantes.
      </p>

      <div class="hero__actions">

        <a
          routerLink="/auth/register"
          class="btn btn-primary"
        >
          Empezar gratis
          <app-icon name="arrow_forward" [size]="23" />
        </a>

        <a
          href="#promociones"
          class="btn btn-secondary"
        >
          Ver promoción de ejemplo
        </a>

      </div>

    </div>

  </div>

</section>
