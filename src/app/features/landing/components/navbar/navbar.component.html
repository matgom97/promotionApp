<header class="navbar">
  <div class="navbar__container">
    <!-- Logo -->
    <a class="navbar__brand" routerLink="/" (click)="closeMenu()">
      <div class="navbar__logo">♨</div>

      <span class="navbar__name"> Promo<span>Table</span> </span>
    </a>

    <!-- Navegación -->
    <nav class="navbar__links">
      <a href="#funciones">Funciones</a>
      <a href="#como-funciona">Cómo funciona</a>
      <a href="#precios">Precios</a>
      <a href="#preguntas">Preguntas</a>
    </nav>

    <!-- Acciones -->
    <div class="navbar__actions">
      <a class="navbar__login" routerLink="/auth/login"> Entrar </a>

      <a class="btn btn-primary navbar__register" routerLink="/auth/register">
        Crear cuenta
      </a>
    </div>

    <!-- MOBILE MENU BUTTON -->

    <button
      class="navbar__menu"
      type="button"
      [attr.aria-expanded]="isMenuOpen"
      aria-label="Abrir menú"
      (click)="toggleMenu()"
    >
      <span></span>

      <span></span>

      <span></span>
    </button>
  </div>

  <!-- MOBILE MENU -->

  @if (isMenuOpen) {
    <div class="navbar__mobile-menu">
      <nav class="navbar__mobile-links">
        <a href="#funciones" (click)="closeMenu()"> Funciones </a>

        <a href="#como-funciona" (click)="closeMenu()"> Cómo funciona </a>

        <a href="#precios" (click)="closeMenu()"> Precios </a>

        <a href="#preguntas" (click)="closeMenu()"> Preguntas </a>
      </nav>

      <div class="navbar__mobile-actions">
        <a
          class="navbar__mobile-login"
          routerLink="/auth/login"
          (click)="closeMenu()"
        >
          Entrar
        </a>

        <a
          class="btn btn-primary navbar__mobile-register"
          routerLink="/auth/register"
          (click)="closeMenu()"
        >
          Crear cuenta
        </a>
      </div>
    </div>
  }
</header>
